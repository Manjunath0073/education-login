<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 - Stackly</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <link rel="stylesheet" href="404.css">

</head>
<body>

  <!-- =========================
       MAIN CONTAINER
  ========================== -->
  <section class="error-container">

    <!-- BLUR EFFECTS -->
    <div class="blur blur-one"></div>
    <div class="blur blur-two"></div>

    <!-- =========================
         LOGO
    ========================== -->
    <a href="index.html" class="logo">

        <i class="fa-solid fa-graduation-cap"></i>
        <span>Stackly</span>

        </a>

    <!-- =========================
         ERROR CONTENT
    ========================== -->
    <div class="error-content">

      <!-- ERROR NUMBER -->
      <h1>4<span>0</span>4</h1>

      <!-- TITLE -->
      <h2>Oops! Page Not Found</h2>
        <!-- DESCRIPTION -->
      <p>
        The page you're looking for might have been removed,
        renamed, or is temporarily unavailable.
      </p>

      <!-- ACTION BUTTONS -->
      <div class="error-actions">

        <a href="index.html" class="primary-btn">
          <i class="fa-solid fa-house"></i>
          Back To Home
        </a>

        <a href="#" class="secondary-btn" onclick="history.back()">
        <i class="fa-solid fa-arrow-left"></i>
        Go Back
        </a>

      </div>


      </div>
    </div>

  </section>

</body>
</html>
